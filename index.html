<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Med64 — Medical Exam Platform</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#162033;--muted:#687386;--line:#dfe5ee;--primary:#2563eb;--primary2:#1d4ed8;--danger:#dc2626;--good:#16a34a;--shadow:0 8px 28px #16203312}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#eff6ff,#f8fafc)}
.loginbox{width:min(420px,100%);background:var(--card);padding:34px;border-radius:20px;box-shadow:var(--shadow);border:1px solid var(--line)}
.logo{font-weight:900;font-size:28px;color:var(--primary)}.muted{color:var(--muted)}
.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text)}
textarea{min-height:100px;resize:vertical}.btn{padding:10px 15px;border-radius:10px;font-weight:700}.primary{background:var(--primary);color:white}.primary:hover{background:var(--primary2)}.secondary{background:#eef2f7;color:var(--text)}.danger{background:#fee2e2;color:#991b1b}.success{background:#dcfce7;color:#166534}
#app{min-height:100vh;display:flex}.sidebar{width:250px;background:#111827;color:#dbe4f0;padding:20px;position:fixed;inset:0 auto 0 0;z-index:5}.brand{font-size:23px;font-weight:900;color:white;margin:5px 8px 25px}.nav button{display:block;width:100%;text-align:left;padding:11px 12px;margin:4px 0;border-radius:9px;background:transparent;color:#cbd5e1}.nav button.active,.nav button:hover{background:#1f2937;color:white}.main{margin-left:250px;width:calc(100% - 250px);padding:25px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.top h1{margin:0;font-size:26px}.actions{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:0 3px 12px #16203308}.stat{font-size:30px;font-weight:900;margin-top:5px}.section{margin-bottom:20px}.tablewrap{overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}.table{width:100%;border-collapse:collapse;min-width:700px}.table th,.table td{padding:12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.table th{background:#f8fafc;font-size:13px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#e8eefc;color:#1d4ed8;font-size:12px;font-weight:700}.progressbar{height:9px;background:#e8edf4;border-radius:99px;overflow:hidden}.progressbar>i{display:block;height:100%;background:var(--primary)}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:20px;z-index:20}.modalbox{width:min(760px,100%);max-height:90vh;overflow:auto;background:var(--card);border-radius:16px;padding:22px}.option{border:1px solid var(--line);background:#fff;padding:14px;border-radius:10px;margin:9px 0;text-align:left;width:100%}.option.selected{border:2px solid var(--primary);background:#eff6ff}.option.correct{border-color:var(--good);background:#f0fdf4}.option.wrong{border-color:var(--danger);background:#fef2f2}.quizbox{max-width:900px;margin:auto}.qtext{font-size:21px;line-height:1.5;font-weight:700}.review{border-left:4px solid var(--primary);padding:12px 15px;background:#f8fafc;margin:12px 0;border-radius:7px}.toast{position:fixed;right:20px;bottom:20px;background:#111827;color:#fff;padding:12px 16px;border-radius:10px;z-index:99}
@media(max-width:800px){.sidebar{width:68px;padding:10px}.brand{font-size:0}.brand:after{content:"M64";font-size:20px}.nav button{font-size:0;text-align:center}.nav button:before{content:"•";font-size:22px}.main{margin-left:68px;width:calc(100% - 68px);padding:15px}.top{align-items:flex-start;flex-direction:column}}

.template{white-space:pre-wrap;background:var(--panel2,#f6f7fb);padding:14px;border-radius:10px;font-size:12px;line-height:1.55}
.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{width:100%;margin-top:8px}.notice{padding:12px;border-radius:10px;background:var(--panel2,#f6f7fb);margin-top:12px}
.mini{padding:10px 0;border-bottom:1px solid var(--border,#ddd)}.table-wrap{overflow:auto}
.smallbtn{padding:6px 9px;border:1px solid var(--border,#ddd);border-radius:7px;background:transparent;cursor:pointer}
.smallbtn.danger{color:#b42318}.actions{display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>

<div id="login">
  <div class="loginbox">
    <div class="logo">Med64</div>
    <h1>Medical Exam Platform</h1>
    <p class="muted">Secure cloud login powered by Supabase.</p>
    <div class="field"><label>Login ID</label><input id="loginId" value="admin" autocomplete="username"></div>
    <div class="field"><label>Password</label><input id="loginPw" type="password" autocomplete="current-password"></div>
    <button id="signInBtn" type="button" class="btn primary" style="width:100%">Sign in</button>
    <p id="loginMsg" class="muted"></p>
    <small class="muted">Use the User ID and password created by your administrator.</small>
  </div>
</div>

<div id="app" class="hidden">
<aside class="sidebar">
  <div class="brand">Med64</div>
  <div class="nav">
    <button data-page="dashboard" onclick="page('dashboard')">Dashboard</button>
    <button data-page="exam" onclick="page('exam')">Start Exam</button>
    <button data-page="questions" onclick="page('questions')">Question Bank</button>
    <button data-page="users" onclick="page('users')" style="display:none">User Management</button>
    <button data-page="add" onclick="page('add')">Add Questions</button>
    <button data-page="progress" onclick="page('progress')">Progress</button>
    <button data-page="mistakes" onclick="page('mistakes')">Mistakes</button>
    <button data-page="data" onclick="page('data')">Import / Export</button>
    <button data-page="settings" onclick="page('settings')">Settings</button>
  </div>
  <button class="btn secondary" style="width:100%;margin-top:25px" onclick="logout()">Logout</button>
</aside>
<main class="main">
  <div id="content"></div>
</main>
</div>

<div id="modal" class="modal hidden"><div class="modalbox" id="modalBox"></div></div>
<div id="toast" class="toast hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ================= MED64 SECURE SUPABASE CONFIG =================
// Replace these two values with your Supabase project values.
const SUPABASE_URL = 'YOUR_SUPABASE_URL';
const SUPABASE_KEY = 'YOUR_SUPABASE_PUBLISHABLE_KEY';
let supabase = null;
let supabaseInitError = null;

function setLoginMessage(text, isError=false){
  const el=document.getElementById('loginMsg');
  if(el){el.textContent=text;el.style.color=isError?'#b42318':'';}
}

try {
  if (!window.supabase || typeof window.supabase.createClient !== 'function') {
    throw new Error('Supabase library did not load.');
  }
  if (!SUPABASE_URL || SUPABASE_URL.startsWith('YOUR_') || !SUPABASE_KEY || SUPABASE_KEY.startsWith('YOUR_')) {
    throw new Error('Supabase URL or publishable key is missing.');
  }
  supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
} catch (e) {
  supabaseInitError = e;
  console.error('Med64 Supabase initialization failed:', e);
}

const signInBtn = document.getElementById('signInBtn');
if (signInBtn) signInBtn.addEventListener('click', login);
const loginPwEl = document.getElementById('loginPw');
if (loginPwEl) loginPwEl.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

let db={questions:[],progress:{},mistakes:[],settings:{}};
let current=null;
let currentUser=null;
let currentProfile=null;

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(x){let t=document.getElementById('toast');t.textContent=x;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2400)}
function syntheticEmail(username){return `${String(username).trim().toLowerCase()}@users.med64.local`}
function isAdmin(){return currentProfile?.role==='admin' && currentProfile?.active!==false}
function showApp(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden')}
function showLogin(){document.getElementById('login').classList.remove('hidden');document.getElementById('app').classList.add('hidden')}

async function loadCloudDB(){
  if(!currentUser) return;
  const [qres,pres,mres] = await Promise.all([
    supabase.from('questions').select('*').eq('active',true).order('created_at',{ascending:true}),
    supabase.from('user_progress').select('question_id,attempts,correct').eq('user_id',currentUser.id),
    supabase.from('user_mistakes').select('question_id').eq('user_id',currentUser.id)
  ]);
  if(qres.error) throw qres.error;
  if(pres.error) throw pres.error;
  if(mres.error) throw mres.error;
  db.questions=(qres.data||[]).map(q=>({...q,options:Array.isArray(q.options)?q.options:[],correctIndex:Number(q.correct_index)}));
  db.progress={};(pres.data||[]).forEach(x=>db.progress[x.question_id]={attempts:x.attempts,correct:x.correct});
  db.mistakes=(mres.data||[]).map(x=>x.question_id);
}

async function refreshProfile(){
  if(!currentUser){currentProfile=null;return;}
  const {data,error}=await supabase.from('profiles').select('*').eq('id',currentUser.id).single();
  if(error) throw error;
  currentProfile=data;
}

async function login(){
  const id=document.getElementById('loginId').value.trim().toLowerCase();
  const pw=document.getElementById('loginPw').value;
  const btn=document.getElementById('signInBtn');
  if(!id||!pw){setLoginMessage('Enter your User ID and password.', true);return}
  if(supabaseInitError || !supabase){
    setLoginMessage('Supabase is not ready. Please check the Project URL and Publishable key in index.html.', true);
    console.error('Supabase initialization error:', supabaseInitError);
    return;
  }
  if(btn){btn.disabled=true;btn.textContent='Signing in…';}
  setLoginMessage('Signing in…');
  try {
    const {data,error}=await supabase.auth.signInWithPassword({email:syntheticEmail(id),password:pw});
    if(error){setLoginMessage(error.message || 'Incorrect User ID or password.', true);return}
    currentUser=data.user;
    await refreshProfile();
    if(!currentProfile?.active){
      await supabase.auth.signOut();
      currentUser=null; currentProfile=null;
      setLoginMessage('This account is disabled.', true);
      return;
    }
    await loadCloudDB();
    showApp();
    applyRoleUI();
    page('dashboard');
    setLoginMessage('');
  } catch(e) {
    console.error('Med64 login error:', e);
    try { await supabase.auth.signOut(); } catch (_) {}
    setLoginMessage('Login failed: ' + (e?.message || 'Please check your Supabase setup.'), true);
  } finally {
    if(btn){btn.disabled=false;btn.textContent='Sign in';}
  }
}

async function logout(){await supabase.auth.signOut();currentUser=null;currentProfile=null;current=null;showLogin();document.getElementById('loginPw').value=''}

function applyRoleUI(){
  const adminBtn=document.querySelector('[data-page="users"]');
  if(adminBtn) adminBtn.style.display=isAdmin()?'block':'none';
  const qBtn=document.querySelector('[data-page="questions"]');
  if(qBtn) qBtn.style.display=isAdmin()?'block':'none';
  const addBtn=document.querySelector('[data-page="add"]');
  if(addBtn) addBtn.style.display=isAdmin()?'block':'none';
  const dataBtn=document.querySelector('[data-page="data"]');
  if(dataBtn) dataBtn.style.display=isAdmin()?'block':'none';
  const settingsBtn=document.querySelector('[data-page="settings"]');
  if(settingsBtn) settingsBtn.style.display=isAdmin()?'block':'none';
}

function page(p){
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));
  let c=document.getElementById('content');
  if(p==='dashboard')dashboard(c);
  if(p==='exam')examSetup(c);
  if(p==='questions'&&isAdmin())questionBank(c);
  if(p==='add'&&isAdmin())addPage(c);
  if(p==='progress')progressPage(c);
  if(p==='mistakes')mistakesPage(c);
  if(p==='data'&&isAdmin())dataPage(c);
  if(p==='settings'&&isAdmin())settingsPage(c);
  if(p==='users'&&isAdmin())usersPage(c);
}
function head(title,sub=''){return `<div class="top"><div><h1>${title}</h1><div class="muted">${sub}</div></div><div class="actions"></div></div>`}

function dashboard(c){
  let qs=db.questions, attempted=Object.values(db.progress).filter(x=>x.attempts>0), totalAtt=attempted.reduce((a,x)=>a+x.attempts,0), correct=attempted.reduce((a,x)=>a+x.correct,0), cats=new Set(qs.map(q=>q.category||'General')).size, secs=new Set(qs.map(q=>q.section||q.category||'General')).size;
  c.innerHTML=head('Dashboard',`Welcome, ${esc(currentProfile?.display_name||currentProfile?.username||'User')}`)+`<div class="grid">
  <div class="card"><div class="muted">Questions</div><div class="stat">${qs.length}</div></div><div class="card"><div class="muted">Sections</div><div class="stat">${secs}</div></div><div class="card"><div class="muted">Categories</div><div class="stat">${cats}</div></div><div class="card"><div class="muted">Accuracy</div><div class="stat">${totalAtt?Math.round(correct/totalAtt*100):0}%</div></div></div>
  <div class="card section" style="margin-top:18px"><h2>Quick actions</h2><div class="actions"><button class="btn primary" onclick="page('exam')">Start exam</button><button class="btn secondary" onclick="page('progress')">View progress</button>${isAdmin()?'<button class="btn secondary" onclick="page(\'users\')">User Management</button>':''}</div></div>`
}

function examSetup(c){let secs=[...new Set(db.questions.map(q=>q.section||q.category||'General'))].sort(), cats=[...new Set(db.questions.map(q=>q.category||'General'))].sort();c.innerHTML=head('Start Exam','Build a test from the central Med64 question bank')+`<div class="card" style="max-width:700px">
<div class="field"><label>Section</label><select id="eSec"><option value="">All sections</option>${secs.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div>
<div class="field"><label>Category</label><select id="eCat"><option value="">All categories</option>${cats.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div>
<div class="field"><label>Number of questions</label><input id="eN" type="number" min="1" value="${Math.min(10,db.questions.length)}"></div>
<div class="field"><label>Time limit (minutes; 0 = unlimited)</label><input id="eTime" type="number" min="0" value="0"></div>
<div class="field"><label>Answer display</label><select id="eDisplay"><option value="immediate">Show answer immediately</option><option value="finish">Show answers after finishing</option></select></div>
<button class="btn primary" onclick="startExam()">Begin exam</button></div>`}
function startExam(){let sec=eSec.value,cat=eCat.value,n=Math.max(1,+eN.value||1),time=Math.max(0,+eTime.value||0),mode=eDisplay.value;let pool=db.questions.filter(q=>(!sec||(q.section||q.category||'General')===sec)&&(!cat||(q.category||'General')===cat));pool.sort(()=>Math.random()-.5);pool=pool.slice(0,n);if(!pool.length)return toast('No questions match those filters.');current={pool,index:0,answers:{},mode,timeLeft:time*60,timer:null};quizRender();if(time)current.timer=setInterval(()=>{current.timeLeft--;let x=document.getElementById('timer');if(x)x.textContent=fmt(current.timeLeft);if(current.timeLeft<=0){clearInterval(current.timer);finishExam()}},1000)}
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function quizRender(){let q=current.pool[current.index], chosen=current.answers[q.id], pct=Math.round((current.index)/current.pool.length*100);document.getElementById('content').innerHTML=head('Exam',`Question ${current.index+1} of ${current.pool.length}`)+`<div class="quizbox card"><div class="actions" style="justify-content:space-between"><span class="badge">${esc(q.section||'General')} · ${esc(q.category||'General')}</span>${current.timeLeft?`<b>Time: <span id="timer">${fmt(current.timeLeft)}</span></b>`:''}</div><div class="progressbar" style="margin:18px 0"><i style="width:${pct}%"></i></div><div class="qtext">${esc(q.question)}</div><div>${q.options.map((o,i)=>`<button class="option ${chosen===i?'selected':''}" onclick="choose(${i})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}</div>${current.mode==='immediate'&&chosen!==undefined?`<div class="review">${chosen===q.correctIndex?'✅ Correct':'❌ Incorrect'}<br><b>Correct:</b> ${esc(q.options[q.correctIndex])}<br>${esc(q.explanation||'')}</div>`:''}<div class="actions" style="margin-top:18px"><button class="btn secondary" onclick="prevQ()" ${current.index===0?'disabled':''}>Previous</button>${current.index===current.pool.length-1?`<button class="btn primary" onclick="finishExam()">Finish</button>`:`<button class="btn primary" onclick="nextQ()">Next</button>`}</div></div>`}

async function choose(i){
  let q=current.pool[current.index]; if(current.answers[q.id]!==undefined)return; current.answers[q.id]=i;
  let p=db.progress[q.id]||{attempts:0,correct:0};p.attempts++;if(i===q.correctIndex)p.correct++;db.progress[q.id]=p;
  const {error:pe}=await supabase.from('user_progress').upsert({user_id:currentUser.id,question_id:q.id,attempts:p.attempts,correct:p.correct,updated_at:new Date().toISOString()});
  if(pe){console.error(pe);toast('Could not save progress.');return}
  if(i!==q.correctIndex){if(!db.mistakes.includes(q.id)){db.mistakes.push(q.id);await supabase.from('user_mistakes').upsert({user_id:currentUser.id,question_id:q.id,updated_at:new Date().toISOString()})}}
  else{db.mistakes=db.mistakes.filter(x=>x!==q.id);await supabase.from('user_mistakes').delete().eq('user_id',currentUser.id).eq('question_id',q.id)}
  quizRender()
}
function nextQ(){if(current.index<current.pool.length-1){current.index++;quizRender()}}
function prevQ(){if(current.index>0){current.index--;quizRender()}}
function finishExam(){if(!current)return;clearInterval(current.timer);let answered=Object.keys(current.answers).length,correct=Object.entries(current.answers).filter(([id,a])=>db.questions.find(q=>q.id===id)?.correctIndex===a).length;let reviews=current.pool.map(q=>{let a=current.answers[q.id];return `<div class="review"><b>${esc(q.question)}</b><br>Your answer: ${a===undefined?'<i>Not answered</i>':esc(q.options[a])}<br>Correct answer: ${esc(q.options[q.correctIndex])}<br><span class="muted">${esc(q.explanation||'')}</span></div>`}).join('');current=null;document.getElementById('content').innerHTML=head('Exam Result','Your answers and performance have been saved to your account')+`<div class="grid"><div class="card"><div class="muted">Score</div><div class="stat">${correct}/${answered}</div></div><div class="card"><div class="muted">Accuracy</div><div class="stat">${answered?Math.round(correct/answered*100):0}%</div></div></div><div class="card" style="margin-top:18px"><h2>Answer review</h2>${reviews}</div>`}

function questionBank(c){let q=db.questions;c.innerHTML=head('Question Bank',`${q.length} questions · admin only`) + `<div class="actions" style="margin-bottom:14px"><button class="btn primary" onclick="page('add')">+ Add question</button><button class="btn secondary" onclick="page('data')">Import JSON</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Question</th><th>Section</th><th>Category</th><th>Answer</th><th>Actions</th></tr></thead><tbody>${q.map(x=>`<tr><td>${esc(x.question)}</td><td><span class="badge">${esc(x.section||'General')}</span></td><td>${esc(x.category||'General')}</td><td>${esc(x.options[x.correctIndex])}</td><td><button class="btn secondary" onclick="editQ('${x.id}')">Edit</button> <button class="btn danger" onclick="deleteQ('${x.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div>`}
function addPage(c,q=null){q=q||{id:'',section:'',category:'',question:'',options:['','','',''],correctIndex:0,explanation:''};c.innerHTML=head(q.id?'Edit Question':'Add Question','Questions are stored centrally in Supabase')+`<div class="card" style="max-width:850px"><input type="hidden" id="qid" value="${esc(q.id)}"><div class="grid"><div class="field"><label>Section</label><input id="qsec" value="${esc(q.section)}" placeholder="e.g. Pharmacology"></div><div class="field"><label>Category</label><input id="qcat" value="${esc(q.category)}" placeholder="e.g. Pharma25"></div></div><div class="field"><label>Question</label><textarea id="qq">${esc(q.question)}</textarea></div>${q.options.map((o,i)=>`<div class="field"><label>Option ${String.fromCharCode(65+i)}</label><input id="op${i}" value="${esc(o)}"></div>`).join('')}<div class="field"><label>Correct option</label><select id="corr">${q.options.map((o,i)=>`<option value="${i}" ${i===q.correctIndex?'selected':''}>${String.fromCharCode(65+i)}</option>`).join('')}</select></div><div class="field"><label>Explanation (optional)</label><textarea id="exp">${esc(q.explanation)}</textarea></div><button class="btn primary" onclick="saveQ()">Save question</button> <button class="btn secondary" onclick="page('questions')">Cancel</button></div>`}
async function saveQ(){let id=qid.value||crypto.randomUUID(), q={id,section:qsec.value.trim()||'General',category:qcat.value.trim()||'General',question:qq.value.trim(),options:[op0.value,op1.value,op2.value,op3.value].map(x=>x.trim()),correct_index:+corr.value,explanation:exp.value.trim(),active:true};if(!q.question||q.options.some(x=>!x))return toast('Complete the question and all 4 options.');let {error}=await supabase.from('questions').upsert(q);if(error)return toast(error.message);await loadCloudDB();toast('Question saved');page('questions')}
function editQ(id){let q=db.questions.find(x=>x.id===id);if(q)addPage(document.getElementById('content'),{id:q.id,section:q.section,category:q.category,question:q.question,options:q.options,correctIndex:q.correctIndex,explanation:q.explanation})}
async function deleteQ(id){if(confirm('Delete this question?')){let {error}=await supabase.from('questions').delete().eq('id',id);if(error)return toast(error.message);await loadCloudDB();questionBank(document.getElementById('content'))}}

function progressPage(c){let groups={};db.questions.forEach(q=>{let s=q.section||q.category||'General',cat=q.category||'General';groups[s]??={};groups[s][cat]??=[];groups[s][cat].push(q)});let out='';for(let s of Object.keys(groups).sort()){out+=`<div class="card section"><h2>${esc(s)}</h2>`;for(let cat of Object.keys(groups[s]).sort()){let arr=groups[s][cat], practiced=arr.filter(q=>(db.progress[q.id]?.attempts||0)>0),att=arr.reduce((a,q)=>a+(db.progress[q.id]?.attempts||0),0),cor=arr.reduce((a,q)=>a+(db.progress[q.id]?.correct||0),0),comp=Math.round(practiced.length/arr.length*100),acc=att?Math.round(cor/att*100):0;out+=`<div style="padding:12px 0"><b>${esc(cat)}</b><span class="muted"> — ${practiced.length}/${arr.length} practiced · ${acc}% accuracy</span><div class="progressbar" style="margin-top:7px"><i style="width:${comp}%"></i></div></div>`}out+='</div>'}c.innerHTML=head('Progress','Calculated from your account in Supabase')+out+`<button class="btn danger" onclick="resetProgress()">Reset my progress</button>`}
async function resetProgress(){if(!confirm('Reset all your progress and mistakes?'))return;await supabase.from('user_progress').delete().eq('user_id',currentUser.id);await supabase.from('user_mistakes').delete().eq('user_id',currentUser.id);await loadCloudDB();progressPage(document.getElementById('content'));toast('Progress reset')}
function mistakesPage(c){let qs=db.mistakes.map(id=>db.questions.find(q=>q.id===id)).filter(Boolean);c.innerHTML=head('Mistakes',`${qs.length} questions in your personal mistake bank`)+(qs.length?qs.map(q=>`<div class="card section"><b>${esc(q.question)}</b><div class="muted">${esc(q.section)} · ${esc(q.category)}</div><div class="review"><b>Correct:</b> ${esc(q.options[q.correctIndex])}<br>${esc(q.explanation||'')}</div><button class="btn success" onclick="removeMistake('${q.id}')">Remove from mistakes</button></div>`).join(''):'<div class="card">No mistakes yet.</div>')}
async function removeMistake(id){await supabase.from('user_mistakes').delete().eq('user_id',currentUser.id).eq('question_id',id);await loadCloudDB();mistakesPage(document.getElementById('content'))}

function dataPage(c){c.innerHTML=head('Import / Export','Admin question-bank tools')+`<div class="grid"><div class="card"><h2>Import JSON</h2><p class="muted">Accepts an array of questions or <code>{"questions":[...]}</code>. IDs are preserved when supplied.</p><input type="file" id="jsonfile" accept=".json,application/json"><br><br><button class="btn primary" onclick="importJSON()">Import file</button></div><div class="card"><h2>Export</h2><p class="muted">Download the current central question bank.</p><button class="btn secondary" onclick="exportJSON()">Download questions.json</button></div></div>`}
async function importJSON(){let f=document.getElementById('jsonfile').files[0];if(!f)return toast('Choose a JSON file.');try{let data=JSON.parse(await f.text()),arr=Array.isArray(data)?data:data.questions;if(!Array.isArray(arr))throw Error();let rows=arr.map(x=>({id:x.id||crypto.randomUUID(),legacy_id:x.id||null,section:x.section||x.category||'General',category:x.category||x.section||'General',question:String(x.question||'').trim(),options:Array.isArray(x.options)?x.options.map(String):[],correct_index:Number(x.correctIndex),explanation:String(x.explanation||''),active:true})).filter(q=>q.question&&q.options.length===4&&Number.isInteger(q.correct_index)&&q.correct_index>=0&&q.correct_index<4);if(!rows.length)return toast('No valid questions found.');let {error}=await supabase.from('questions').upsert(rows);if(error)throw error;await loadCloudDB();toast(`Imported ${rows.length} questions.`);page('questions')}catch(e){toast('Import failed: '+(e.message||'Invalid JSON'))}}
function exportJSON(){let arr=db.questions.map(q=>({id:q.legacy_id||q.id,section:q.section,category:q.category,question:q.question,options:q.options,correctIndex:q.correctIndex,explanation:q.explanation}));let blob=new Blob([JSON.stringify(arr,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='questions.json';a.click();URL.revokeObjectURL(a.href)}
function settingsPage(c){c.innerHTML=head('Settings','Secure account-based configuration')+`<div class="card" style="max-width:700px"><h2>Signed in account</h2><p><b>User ID:</b> ${esc(currentProfile?.username)}</p><p><b>Name:</b> ${esc(currentProfile?.display_name||'')}</p><p><b>Role:</b> ${esc(currentProfile?.role)}</p><p class="muted">Passwords are managed by Supabase Auth and are not stored in this HTML file.</p></div>`}

async function callAdmin(action,body={}){const {data,error}=await supabase.functions.invoke('med64-admin',{body:{action,...body}});if(error)throw error; if(data?.error)throw new Error(data.error);return data}
async function usersPage(c){c.innerHTML=head('User Management','Admin only · create and manage student IDs and passwords')+`<div class="grid"><div class="card"><h2>Create student</h2><div class="field"><label>User ID</label><input id="newUser" placeholder="student01"></div><div class="field"><label>Display name</label><input id="newName" placeholder="Student name"></div><div class="field"><label>Password</label><input id="newPw" type="password" placeholder="At least 8 characters"></div><button class="btn primary" onclick="createStudent()">Create student</button><p class="muted">Students sign in with the User ID and password you create here.</p></div><div class="card"><h2>Security</h2><p class="muted">Student passwords are handled by Supabase Auth. They are never stored in this page or visible to other students.</p><p class="muted">Disabling a student blocks future access without deleting their progress.</p></div></div><div id="userTable" class="card" style="margin-top:16px">Loading users…</div>`;await refreshUsersTable()}
async function refreshUsersTable(){const box=document.getElementById('userTable');if(!box)return;try{let data=await callAdmin('list_users');let rows=data.users||[];box.innerHTML=`<h2>Accounts</h2><div class="table-wrap"><table class="table"><thead><tr><th>User ID</th><th>Name</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead><tbody>${rows.map(u=>`<tr><td>${esc(u.username)}</td><td>${esc(u.display_name)}</td><td>${esc(u.role)}</td><td>${u.active?'Active':'Disabled'}</td><td>${u.role==='student'?`<button class="smallbtn" onclick="toggleStudent('${u.id}',${u.active})">${u.active?'Disable':'Enable'}</button> <button class="smallbtn" onclick="resetStudentPassword('${u.id}','${esc(u.username)}')">Reset password</button> <button class="smallbtn danger" onclick="deleteStudent('${u.id}','${esc(u.username)}')">Delete</button>`:'Admin'}</td></tr>`).join('')}</tbody></table></div>`}catch(e){box.innerHTML=`<p class="muted">Could not load users: ${esc(e.message)}</p>`}}
async function createStudent(){try{let username=document.getElementById('newUser').value.trim(),displayName=document.getElementById('newName').value.trim(),password=document.getElementById('newPw').value;await callAdmin('create_student',{username,displayName,password});document.getElementById('newUser').value='';document.getElementById('newName').value='';document.getElementById('newPw').value='';toast('Student account created');refreshUsersTable()}catch(e){toast(e.message||'Could not create student')}}
async function toggleStudent(id,active){try{await callAdmin('set_user_active',{userId:id,active:!active});refreshUsersTable()}catch(e){toast(e.message)}}
async function resetStudentPassword(id,name){let pw=prompt(`Enter a new password for ${name} (minimum 8 characters):`);if(!pw)return;try{await callAdmin('reset_student_password',{userId:id,password:pw});toast('Password reset successfully')}catch(e){toast(e.message)}}
async function deleteStudent(id,name){if(!confirm(`Delete student ${name}? Their account and personal progress will be deleted.`))return;try{await callAdmin('delete_student',{userId:id});toast('Student deleted');refreshUsersTable()}catch(e){toast(e.message)}}

async function bootstrap(){
  if(SUPABASE_URL.startsWith('YOUR_')){document.getElementById('loginMsg').textContent='Supabase is not configured yet. Open README.md and add your project URL/key.';return}
  const {data:{session}}=await supabase.auth.getSession();
  if(session?.user){currentUser=session.user;try{await refreshProfile();if(!currentProfile?.active){await supabase.auth.signOut();showLogin();return}await loadCloudDB();showApp();applyRoleUI();page('dashboard')}catch(e){console.error(e);showLogin()}}
  else showLogin();
  supabase.auth.onAuthStateChange(async (_event,session)=>{if(session?.user&&!currentUser){currentUser=session.user;try{await refreshProfile();await loadCloudDB();showApp();applyRoleUI();page('dashboard')}catch(e){console.error(e)}}});
}
bootstrap();
</script>
</script>
