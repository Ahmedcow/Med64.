<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Med64 — Medical Examination Platform</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f7fb;color:#172033}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.top{height:64px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:5}
.brand{font-size:22px;font-weight:800;color:#174ea6}.wrap{max-width:1200px;margin:auto;padding:24px}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#eef5ff,#f8fafc)}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:22px;box-shadow:0 8px 30px #17203312}
.login .card{width:min(420px,100%)}h1,h2,h3{margin-top:0}.field{margin:14px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid #cbd5e1;border-radius:10px;background:#fff}.field textarea{min-height:90px;resize:vertical}
.btn{border:0;border-radius:10px;padding:10px 15px;font-weight:700}.primary{background:#174ea6;color:#fff}.secondary{background:#e9eef7;color:#172033}.danger{background:#b42318;color:#fff}.success{background:#18794e;color:#fff}.muted{color:#667085}.error{color:#b42318}.ok{color:#18794e}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.stats{font-size:30px;font-weight:800}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.nav button{background:#fff;border:1px solid #d7dce5;border-radius:10px;padding:9px 12px}.nav button.active{background:#174ea6;color:#fff;border-color:#174ea6}
.q{margin:14px 0;padding:16px;border:1px solid #e1e5ec;border-radius:12px}.option{display:block;padding:11px;margin:8px 0;border:1px solid #d7dce5;border-radius:9px}.option input{margin-right:8px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:left;vertical-align:top}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf2ff;font-size:12px}
.timer{font-size:22px;font-weight:800}.result{padding:14px;border-radius:10px;background:#f0fdf4;margin:10px 0}
</style>
</head>
<body>
<div id="loginView" class="login">
  <div class="card">
    <div class="brand">Med64</div>
    <h1>Sign in</h1>
    <p class="muted">Medical Examination Platform</p>
    <div class="field"><label>User ID</label><input id="loginId" value="admin" autocomplete="username"></div>
    <div class="field"><label>Password</label><input id="loginPw" type="password" autocomplete="current-password"></div>
    <button id="signInBtn" type="button" class="btn primary" style="width:100%" onclick="login()">Sign in</button>
    <p id="loginMsg" class="muted"></p>
  </div>
</div>

<div id="app" class="hidden">
<header class="top"><div class="brand">Med64</div><div class="row"><span id="who" class="muted"></span><button class="btn secondary" onclick="logout()">Sign out</button></div></header>
<main class="wrap">
<nav id="nav" class="nav"></nav>
<section id="content"></section>
</main>
</div>

<script>
const SUPABASE_URL = 'https://oglcdtsdvinsgqlwisyo.supabase.co';
const SUPABASE_KEY = 'sb_publishable_IvSAZoEGVQGqT8W--zz31w_55zOoR2W';
let sb=null,currentUser=null,profile=null,questions=[],progress={},mistakes=new Set(),exam=null,timer=null;

function msg(t,err=false){const e=document.getElementById('loginMsg');if(e){e.textContent=t;e.className=err?'error':'muted';}}
function syntheticEmail(id){return id+'@users.med64.local';}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function isAdmin(){return profile?.role==='admin'&&profile?.active===true;}

async function init(){
 try{
  if(!window.supabase||!window.supabase.createClient) throw new Error('Supabase library did not load.');
  if(SUPABASE_URL.startsWith('YOUR_')||SUPABASE_KEY.startsWith('YOUR_')) throw new Error('Supabase URL or Publishable key is not configured.');
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  const {data}=await sb.auth.getSession();
  if(data.session){currentUser=data.session.user;await enterApp();} else showLogin();
 }catch(e){console.error(e);msg(e.message,true);}
}
function showLogin(){document.getElementById('loginView').classList.remove('hidden');document.getElementById('app').classList.add('hidden');}
async function login(){
 const id=document.getElementById('loginId').value.trim().toLowerCase(),pw=document.getElementById('loginPw').value,btn=document.getElementById('signInBtn');
 if(!id||!pw){msg('Enter your User ID and password.',true);return}
 if(!sb){msg('Supabase is not initialized. Check index.html configuration.',true);return}
 btn.disabled=true;btn.textContent='Signing in…';msg('Signing in…');
 try{
  const {data,error}=await sb.auth.signInWithPassword({email:syntheticEmail(id),password:pw});
  if(error)throw error;
  currentUser=data.user;await enterApp();
 }catch(e){console.error(e);msg(e.message||'Login failed.',true);}
 finally{btn.disabled=false;btn.textContent='Sign in';}
}
async function enterApp(){
 const {data:p,error}=await sb.from('profiles').select('*').eq('id',currentUser.id).single();
 if(error||!p){await sb.auth.signOut();showLogin();msg('User profile not found.',true);return}
 if(!p.active){await sb.auth.signOut();showLogin();msg('This account is disabled.',true);return}
 profile=p;document.getElementById('who').textContent=(p.display_name||p.username)+' ('+p.role+')';
 await loadData();renderNav();page('dashboard');
}
async function logout(){await sb.auth.signOut();currentUser=null;profile=null;showLogin();document.getElementById('loginPw').value='';msg('Signed out.');}
async function loadData(){
 const q=await sb.from('questions').select('*').order('created_at',{ascending:true});
 questions=(q.data||[]).map(x=>({...x,options:Array.isArray(x.options)?x.options:[],correctIndex:x.correct_index}));
 const pr=await sb.from('user_progress').select('*').eq('user_id',currentUser.id);progress={};(pr.data||[]).forEach(x=>progress[x.question_id]=x);
 const mi=await sb.from('user_mistakes').select('question_id').eq('user_id',currentUser.id);mistakes=new Set((mi.data||[]).map(x=>x.question_id));
}
function renderNav(){
 let a=[['dashboard','Dashboard'],['exam','Start Exam'],['progress','Progress'],['mistakes','Mistakes']];
 if(isAdmin())a.push(['bank','Question Bank'],['add','Add Question'],['users','User Management']);
 document.getElementById('nav').innerHTML=a.map(x=>`<button onclick="page('${x[0]}')">${x[1]}</button>`).join('');
}
function page(name){
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.textContent.toLowerCase().replaceAll(' ','').includes(name.replaceAll(' ',''))));
 const c=document.getElementById('content');
 if(name==='dashboard')dashboard(c);else if(name==='exam')examPage(c);else if(name==='progress')progressPage(c);else if(name==='mistakes')mistakesPage(c);else if(name==='bank')bankPage(c);else if(name==='add')addPage(c);else if(name==='users')usersPage(c);
}
function dashboard(c){
 const attempted=Object.values(progress).reduce((n,x)=>n+x.attempts,0),correct=Object.values(progress).reduce((n,x)=>n+x.correct,0);
 c.innerHTML=`<h1>Dashboard</h1><div class="grid"><div class="card"><div class="muted">Questions</div><div class="stats">${questions.length}</div></div><div class="card"><div class="muted">Attempts</div><div class="stats">${attempted}</div></div><div class="card"><div class="muted">Accuracy</div><div class="stats">${attempted?Math.round(correct/attempted*100):0}%</div></div><div class="card"><div class="muted">Mistakes</div><div class="stats">${mistakes.size}</div></div></div>`;
}
function examPage(c){
 const sections=[...new Set(questions.map(q=>q.section||'General'))],cats=[...new Set(questions.map(q=>q.category||'General'))];
 c.innerHTML=`<h1>Start Exam</h1><div class="card"><div class="grid"><div class="field"><label>Section</label><select id="examSection"><option value="">All sections</option>${sections.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Category</label><select id="examCat"><option value="">All categories</option>${cats.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Number of questions</label><input id="examN" type="number" min="1" value="${Math.min(20,questions.length||1)}"></div><div class="field"><label>Time limit (minutes, 0 = unlimited)</label><input id="examTime" type="number" min="0" value="0"></div></div><button class="btn primary" onclick="startExam()">Start exam</button><p id="examMsg" class="error"></p></div>`;
}
function startExam(){
 let qs=questions.filter(q=>(!document.getElementById('examSection').value||(q.section||'General')===document.getElementById('examSection').value)&&(!document.getElementById('examCat').value||(q.category||'General')===document.getElementById('examCat').value));
 if(!qs.length){document.getElementById('examMsg').textContent='No questions match these filters.';return}
 qs.sort(()=>Math.random()-.5);qs=qs.slice(0,Math.max(1,Math.min(qs.length,+document.getElementById('examN').value||qs.length)));
 exam={qs,answers:{},i:0,end:0};const mins=+document.getElementById('examTime').value||0;if(mins)exam.end=Date.now()+mins*60000;renderExam();
}
function renderExam(){
 clearInterval(timer);const c=document.getElementById('content'),q=exam.qs[exam.i],chosen=exam.answers[q.id];
 c.innerHTML=`<div class="row"><h1>Exam</h1><div id="timer" class="timer"></div></div><div class="card"><div class="muted">Question ${exam.i+1} of ${exam.qs.length}</div><h2>${esc(q.question)}</h2>${q.options.map((o,i)=>`<label class="option"><input type="radio" name="ans" ${chosen===i?'checked':''} onchange="exam.answers['${q.id}']=${i}"> ${esc(o)}</label>`).join('')}<div class="row" style="margin-top:18px"><button class="btn secondary" ${exam.i===0?'disabled':''} onclick="exam.i--;renderExam()">Previous</button>${exam.i<exam.qs.length-1?`<button class="btn primary" onclick="exam.i++;renderExam()">Next</button>`:`<button class="btn success" onclick="finishExam()">Submit exam</button>`}</div></div>`;
 if(exam.end){updateTimer();timer=setInterval(updateTimer,1000);}
}
function updateTimer(){if(!exam?.end)return;const left=Math.max(0,exam.end-Date.now());const s=Math.ceil(left/1000);const e=document.getElementById('timer');if(e)e.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');if(!s)finishExam();}
async function finishExam(){
 clearInterval(timer);const qs=exam.qs;let score=0;
 for(const q of qs){const a=exam.answers[q.id];const ok=a===q.correctIndex;if(ok)score++;const old=progress[q.id]||{attempts:0,correct:0};await sb.from('user_progress').upsert({user_id:currentUser.id,question_id:q.id,attempts:(old.attempts||0)+1,correct:(old.correct||0)+(ok?1:0),updated_at:new Date().toISOString()});if(!ok)await sb.from('user_mistakes').upsert({user_id:currentUser.id,question_id:q.id});else await sb.from('user_mistakes').delete().eq('user_id',currentUser.id).eq('question_id',q.id);}
 await loadData();document.getElementById('content').innerHTML=`<h1>Exam Result</h1><div class="card"><div class="stats">${score} / ${qs.length}</div><p>Score: ${Math.round(score/qs.length*100)}%</p><button class="btn primary" onclick="page('exam')">Back to exams</button></div>`;exam=null;
}
function progressPage(c){
 const rows=questions.map(q=>{const p=progress[q.id];return {q,p}}).filter(x=>x.p);
 c.innerHTML=`<h1>Progress</h1><div class="card"><table class="table"><tr><th>Section</th><th>Category</th><th>Question</th><th>Attempts</th><th>Accuracy</th></tr>${rows.map(x=>`<tr><td>${esc(x.q.section)}</td><td>${esc(x.q.category)}</td><td>${esc(x.q.question)}</td><td>${x.p.attempts}</td><td>${Math.round((x.p.correct/x.p.attempts)*100)}%</td></tr>`).join('')}</table>${!rows.length?'<p class="muted">No progress yet.</p>':''}</div>`;
}
function mistakesPage(c){
 const ms=questions.filter(q=>mistakes.has(q.id));c.innerHTML=`<h1>Mistakes</h1>${ms.length?ms.map(q=>`<div class="q"><b>${esc(q.question)}</b><p class="muted">${esc(q.category)}</p><button class="btn primary" onclick="startMistake('${q.id}')">Practice</button></div>`).join(''):'<div class="card"><p>No mistakes yet.</p></div>'}`;
}
function startMistake(id){const q=questions.find(x=>x.id===id);exam={qs:[q],answers:{},i:0,end:0};renderExam();}
function bankPage(c){
 if(!isAdmin())return page('dashboard');c.innerHTML=`<h1>Question Bank</h1><div class="card"><p>${questions.length} questions</p><table class="table"><tr><th>Section</th><th>Category</th><th>Question</th><th>Action</th></tr>${questions.map(q=>`<tr><td>${esc(q.section)}</td><td>${esc(q.category)}</td><td>${esc(q.question)}</td><td><button class="btn danger" onclick="deleteQuestion('${q.id}')">Delete</button></td></tr>`).join('')}</table></div>`;
}
async function deleteQuestion(id){if(!confirm('Delete this question?'))return;const {error}=await sb.from('questions').delete().eq('id',id);if(error)return alert(error.message);await loadData();bankPage(document.getElementById('content'));}
function addPage(c){
 if(!isAdmin())return page('dashboard');
 c.innerHTML=`<h1>Add Question</h1><div class="card"><div class="grid"><div class="field"><label>Section</label><input id="aSection" value="General"></div><div class="field"><label>Category</label><input id="aCat" value="General"></div></div><div class="field"><label>Question</label><textarea id="aQ"></textarea></div>${['A','B','C','D'].map((x,i)=>`<div class="field"><label>Option ${x}</label><input id="a${i}"></div>`).join('')}<div class="field"><label>Correct option</label><select id="aCorrect"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select></div><div class="field"><label>Explanation</label><textarea id="aExp"></textarea></div><button class="btn primary" onclick="saveQuestion()">Save question</button><p id="addMsg"></p></div>`;
}
async function saveQuestion(){
 const opts=[0,1,2,3].map(i=>document.getElementById('a'+i).value.trim()),question=document.getElementById('aQ').value.trim();
 if(!question||opts.some(x=>!x)){document.getElementById('addMsg').textContent='Complete the question and all four options.';return}
 const {error}=await sb.from('questions').insert({section:document.getElementById('aSection').value.trim()||'General',category:document.getElementById('aCat').value.trim()||'General',question,options:opts,correct_index:+document.getElementById('aCorrect').value,explanation:document.getElementById('aExp').value.trim(),active:true});
 document.getElementById('addMsg').textContent=error?error.message:'Question saved successfully.';if(!error)await loadData();
}
async function callAdmin(body){
 const {data:{session}}=await sb.auth.getSession();if(!session)throw new Error('Session expired.');const r=await fetch(SUPABASE_URL+'/functions/v1/med64-admin',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':SUPABASE_KEY},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.error||'Admin function failed');return d;
}
async function usersPage(c){
 if(!isAdmin())return page('dashboard');c.innerHTML=`<h1>User Management</h1><div class="card"><h3>Create student</h3><div class="grid"><div class="field"><label>User ID</label><input id="uName"></div><div class="field"><label>Display name</label><input id="uDisplay"></div><div class="field"><label>Password</label><input id="uPass" type="password"></div></div><button class="btn primary" onclick="createStudent()">Create student</button><p id="uMsg"></p></div><div id="usersList" class="card"><p>Loading…</p></div>`;loadUsers();
}
async function loadUsers(){try{const d=await callAdmin({action:'list_users'});document.getElementById('usersList').innerHTML=`<table class="table"><tr><th>User ID</th><th>Name</th><th>Role</th><th>Status</th></tr>${(d.users||[]).map(u=>`<tr><td>${esc(u.username)}</td><td>${esc(u.display_name)}</td><td><span class="pill">${esc(u.role)}</span></td><td>${u.active?'Active':'Disabled'}</td></tr>`).join('')}</table>`}catch(e){document.getElementById('usersList').textContent=e.message}}
async function createStudent(){try{const d=await callAdmin({action:'create_student',username:document.getElementById('uName').value,displayName:document.getElementById('uDisplay').value,password:document.getElementById('uPass').value});document.getElementById('uMsg').className='ok';document.getElementById('uMsg').textContent='Student created: '+d.username;loadUsers()}catch(e){document.getElementById('uMsg').className='error';document.getElementById('uMsg').textContent=e.message}}
document.getElementById('loginPw').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
init();
</script>
</body>
</html>
