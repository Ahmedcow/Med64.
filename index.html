<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Med64 — Medical Exam Platform</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#162033;--muted:#687386;--line:#dfe5ee;--primary:#2563eb;--primary2:#1d4ed8;--danger:#dc2626;--good:#16a34a;--shadow:0 8px 28px #16203312}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#eff6ff,#f8fafc)}
.loginbox{width:min(420px,100%);background:var(--card);padding:34px;border-radius:20px;box-shadow:var(--shadow);border:1px solid var(--line)}
.logo{font-weight:900;font-size:28px;color:var(--primary)}.muted{color:var(--muted)}
.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text)}
textarea{min-height:100px;resize:vertical}.btn{padding:10px 15px;border-radius:10px;font-weight:700}.primary{background:var(--primary);color:white}.primary:hover{background:var(--primary2)}.secondary{background:#eef2f7;color:var(--text)}.danger{background:#fee2e2;color:#991b1b}.success{background:#dcfce7;color:#166534}
#app{min-height:100vh;display:flex}.sidebar{width:250px;background:#111827;color:#dbe4f0;padding:20px;position:fixed;inset:0 auto 0 0;z-index:5}.brand{font-size:23px;font-weight:900;color:white;margin:5px 8px 25px}.nav button{display:block;width:100%;text-align:left;padding:11px 12px;margin:4px 0;border-radius:9px;background:transparent;color:#cbd5e1}.nav button.active,.nav button:hover{background:#1f2937;color:white}.main{margin-left:250px;width:calc(100% - 250px);padding:25px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.top h1{margin:0;font-size:26px}.actions{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:0 3px 12px #16203308}.stat{font-size:30px;font-weight:900;margin-top:5px}.section{margin-bottom:20px}.tablewrap{overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}.table{width:100%;border-collapse:collapse;min-width:700px}.table th,.table td{padding:12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.table th{background:#f8fafc;font-size:13px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#e8eefc;color:#1d4ed8;font-size:12px;font-weight:700}.progressbar{height:9px;background:#e8edf4;border-radius:99px;overflow:hidden}.progressbar>i{display:block;height:100%;background:var(--primary)}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:20px;z-index:20}.modalbox{width:min(760px,100%);max-height:90vh;overflow:auto;background:var(--card);border-radius:16px;padding:22px}.option{border:1px solid var(--line);background:#fff;padding:14px;border-radius:10px;margin:9px 0;text-align:left;width:100%}.option.selected{border:2px solid var(--primary);background:#eff6ff}.option.correct{border-color:var(--good);background:#f0fdf4}.option.wrong{border-color:var(--danger);background:#fef2f2}.quizbox{max-width:900px;margin:auto}.qtext{font-size:21px;line-height:1.5;font-weight:700}.review{border-left:4px solid var(--primary);padding:12px 15px;background:#f8fafc;margin:12px 0;border-radius:7px}.toast{position:fixed;right:20px;bottom:20px;background:#111827;color:#fff;padding:12px 16px;border-radius:10px;z-index:99}
@media(max-width:800px){.sidebar{width:68px;padding:10px}.brand{font-size:0}.brand:after{content:"M64";font-size:20px}.nav button{font-size:0;text-align:center}.nav button:before{content:"•";font-size:22px}.main{margin-left:68px;width:calc(100% - 68px);padding:15px}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>

<div id="login">
  <div class="loginbox">
    <div class="logo">Med64</div>
    <h1>Medical Exam Platform</h1>
    <p class="muted">Secure-looking local administrator access for this standalone version.</p>
    <div class="field"><label>Login ID</label><input id="loginId" value="admin" autocomplete="username"></div>
    <div class="field"><label>Password</label><input id="loginPw" type="password" autocomplete="current-password"></div>
    <button class="btn primary" style="width:100%" onclick="login()">Sign in</button>
    <p id="loginMsg" class="muted"></p>
    <small class="muted">Default: admin / Med64@123</small>
  </div>
</div>

<div id="app" class="hidden">
<aside class="sidebar">
  <div class="brand">Med64</div>
  <div class="nav">
    <button data-page="dashboard" onclick="page('dashboard')">Dashboard</button>
    <button data-page="exam" onclick="page('exam')">Start Exam</button>
    <button data-page="questions" onclick="page('questions')">Question Bank</button>
    <button data-page="add" onclick="page('add')">Add Questions</button>
    <button data-page="progress" onclick="page('progress')">Progress</button>
    <button data-page="mistakes" onclick="page('mistakes')">Mistakes</button>
    <button data-page="data" onclick="page('data')">Import / Export</button>
    <button data-page="settings" onclick="page('settings')">Settings</button>
  </div>
  <button class="btn secondary" style="width:100%;margin-top:25px" onclick="logout()">Logout</button>
</aside>
<main class="main">
  <div id="content"></div>
</main>
</div>

<div id="modal" class="modal hidden"><div class="modalbox" id="modalBox"></div></div>
<div id="toast" class="toast hidden"></div>

<script>
const KEY='med64_v3_db';
const AUTH='med64_v3_auth';
let db=loadDB(), current=null;

function seed(){return [
{id:'demo-cardio-1',section:'Medicine',category:'Cardiology',question:'Which cardiac biomarker is most specific for myocardial injury?',options:['CK-MB','Troponin I','Myoglobin','LDH'],correctIndex:1,explanation:'Cardiac troponins are highly specific for myocardial injury.'},
{id:'demo-anat-1',section:'Basic Sciences',category:'Anatomy',question:'Which chamber pumps blood into the systemic circulation?',options:['Right atrium','Right ventricle','Left atrium','Left ventricle'],correctIndex:3,explanation:'The left ventricle pumps oxygenated blood into the aorta.'}
]}
function loadDB(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.questions))return x}catch(e){}return {questions:seed(),progress:{},mistakes:[],settings:{loginId:'admin',password:'Med64@123'}}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function uid(){return 'q-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(x){let t=document.getElementById('toast');t.textContent=x;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2200)}
function login(){let id=loginId.value,pw=loginPw.value;if(id===db.settings.loginId&&pw===db.settings.password){sessionStorage.setItem(AUTH,'1');document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');page('dashboard')}else loginMsg.textContent='Incorrect login ID or password.'}
function logout(){sessionStorage.removeItem(AUTH);location.reload()}
function page(p){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));let c=document.getElementById('content');if(p==='dashboard')dashboard(c);if(p==='exam')examSetup(c);if(p==='questions')questionBank(c);if(p==='add')addPage(c);if(p==='progress')progressPage(c);if(p==='mistakes')mistakesPage(c);if(p==='data')dataPage(c);if(p==='settings')settingsPage(c)}
function head(title,sub=''){return `<div class="top"><div><h1>${title}</h1><div class="muted">${sub}</div></div><div class="actions"></div></div>`}
function dashboard(c){let qs=db.questions, attempted=Object.values(db.progress).filter(x=>x.attempts>0), totalAtt=attempted.reduce((a,x)=>a+x.attempts,0), correct=attempted.reduce((a,x)=>a+x.correct,0), cats=new Set(qs.map(q=>q.category||'General')).size, secs=new Set(qs.map(q=>q.section||q.category||'General')).size;
c.innerHTML=head('Dashboard','Your exam bank, performance and study controls')+`<div class="grid">
<div class="card"><div class="muted">Questions</div><div class="stat">${qs.length}</div></div><div class="card"><div class="muted">Sections</div><div class="stat">${secs}</div></div><div class="card"><div class="muted">Categories</div><div class="stat">${cats}</div></div><div class="card"><div class="muted">Accuracy</div><div class="stat">${totalAtt?Math.round(correct/totalAtt*100):0}%</div></div></div>
<div class="card section" style="margin-top:18px"><h2>Quick actions</h2><div class="actions"><button class="btn primary" onclick="page('exam')">Start exam</button><button class="btn secondary" onclick="page('add')">Add questions</button><button class="btn secondary" onclick="page('data')">Import JSON</button><button class="btn secondary" onclick="page('progress')">View progress</button></div></div>`}
function examSetup(c){let secs=[...new Set(db.questions.map(q=>q.section||q.category||'General'))].sort(), cats=[...new Set(db.questions.map(q=>q.category||'General'))].sort();c.innerHTML=head('Start Exam','Build a test from your current question bank')+`<div class="card" style="max-width:700px">
<div class="field"><label>Section</label><select id="eSec"><option value="">All sections</option>${secs.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div>
<div class="field"><label>Category</label><select id="eCat"><option value="">All categories</option>${cats.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div>
<div class="field"><label>Number of questions</label><input id="eN" type="number" min="1" value="${Math.min(10,db.questions.length)}"></div>
<div class="field"><label>Time limit (minutes; 0 = unlimited)</label><input id="eTime" type="number" min="0" value="0"></div>
<div class="field"><label>Answer display</label><select id="eDisplay"><option value="immediate">Show answer immediately</option><option value="finish">Show answers after finishing</option></select></div>
<button class="btn primary" onclick="startExam()">Begin exam</button></div>`}
function startExam(){let sec=eSec.value,cat=eCat.value,n=Math.max(1,+eN.value||1),time=Math.max(0,+eTime.value||0),mode=eDisplay.value;let pool=db.questions.filter(q=>(!sec||(q.section||q.category||'General')===sec)&&(!cat||(q.category||'General')===cat));pool.sort(()=>Math.random()-.5);pool=pool.slice(0,n);if(!pool.length)return toast('No questions match those filters.');current={pool,index:0,answers:{},mode,timeLeft:time*60,timer:null};quizRender();if(time)current.timer=setInterval(()=>{current.timeLeft--;let x=document.getElementById('timer');if(x)x.textContent=fmt(current.timeLeft);if(current.timeLeft<=0){clearInterval(current.timer);finishExam()}},1000)}
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function quizRender(){let q=current.pool[current.index], chosen=current.answers[q.id], pct=Math.round((current.index)/current.pool.length*100);document.getElementById('content').innerHTML=head('Exam',`Question ${current.index+1} of ${current.pool.length}`)+`<div class="quizbox card"><div class="actions" style="justify-content:space-between"><span class="badge">${esc(q.section||'General')} · ${esc(q.category||'General')}</span>${current.timeLeft?`<b>Time: <span id="timer">${fmt(current.timeLeft)}</span></b>`:''}</div><div class="progressbar" style="margin:18px 0"><i style="width:${pct}%"></i></div><div class="qtext">${esc(q.question)}</div><div>${q.options.map((o,i)=>`<button class="option ${chosen===i?'selected':''}" onclick="choose(${i})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}</div>${current.mode==='immediate'&&chosen!==undefined?`<div class="review">${chosen===q.correctIndex?'✅ Correct':'❌ Incorrect'}<br><b>Correct:</b> ${esc(q.options[q.correctIndex])}<br>${esc(q.explanation||'')}</div>`:''}<div class="actions" style="margin-top:18px"><button class="btn secondary" onclick="prevQ()" ${current.index===0?'disabled':''}>Previous</button>${current.index===current.pool.length-1?`<button class="btn primary" onclick="finishExam()">Finish</button>`:`<button class="btn primary" onclick="nextQ()">Next</button>`}</div></div>`}
function choose(i){let q=current.pool[current.index];if(current.answers[q.id]!==undefined)return;current.answers[q.id]=i;let p=db.progress[q.id]||{attempts:0,correct:0};p.attempts++;if(i===q.correctIndex)p.correct++;db.progress[q.id]=p;if(i!==q.correctIndex&&!db.mistakes.includes(q.id))db.mistakes.push(q.id);save();quizRender()}
function nextQ(){if(current.index<current.pool.length-1){current.index++;quizRender()}}
function prevQ(){if(current.index>0){current.index--;quizRender()}}
function finishExam(){if(!current)return;clearInterval(current.timer);let answered=Object.keys(current.answers).length,correct=Object.entries(current.answers).filter(([id,a])=>db.questions.find(q=>q.id===id)?.correctIndex===a).length;let reviews=current.pool.map(q=>{let a=current.answers[q.id];return `<div class="review"><b>${esc(q.question)}</b><br>Your answer: ${a===undefined?'<i>Not answered</i>':esc(q.options[a])}<br>Correct answer: ${esc(q.options[q.correctIndex])}<br><span class="muted">${esc(q.explanation||'')}</span></div>`}).join('');current=null;document.getElementById('content').innerHTML=head('Exam Result','Your answers have been saved')+`<div class="grid"><div class="card"><div class="muted">Score</div><div class="stat">${correct}/${answered}</div></div><div class="card"><div class="muted">Accuracy</div><div class="stat">${answered?Math.round(correct/answered*100):0}%</div></div></div><div class="card" style="margin-top:18px"><h2>Answer review</h2>${reviews}</div>`}
function questionBank(c){let q=db.questions;c.innerHTML=head('Question Bank',`${q.length} questions`) + `<div class="actions" style="margin-bottom:14px"><button class="btn primary" onclick="page('add')">+ Add question</button><button class="btn secondary" onclick="page('data')">Import JSON</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Question</th><th>Section</th><th>Category</th><th>Answer</th><th>Actions</th></tr></thead><tbody>${q.map(x=>`<tr><td>${esc(x.question)}</td><td><span class="badge">${esc(x.section||'General')}</span></td><td>${esc(x.category||'General')}</td><td>${esc(x.options[x.correctIndex])}</td><td><button class="btn secondary" onclick="editQ('${x.id}')">Edit</button> <button class="btn danger" onclick="deleteQ('${x.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div>`}
function addPage(c,q=null){q=q||{id:'',section:'',category:'',question:'',options:['','','',''],correctIndex:0,explanation:''};c.innerHTML=head(q.id?'Edit Question':'Add Question','Questions can be added or edited at any time')+`<div class="card" style="max-width:850px"><input type="hidden" id="qid" value="${esc(q.id)}"><div class="grid"><div class="field"><label>Section</label><input id="qsec" value="${esc(q.section)}" placeholder="e.g. Medicine"></div><div class="field"><label>Category</label><input id="qcat" value="${esc(q.category)}" placeholder="e.g. Cardiology"></div></div><div class="field"><label>Question</label><textarea id="qq">${esc(q.question)}</textarea></div>${q.options.map((o,i)=>`<div class="field"><label>Option ${String.fromCharCode(65+i)}</label><input id="op${i}" value="${esc(o)}"></div>`).join('')}<div class="field"><label>Correct option</label><select id="corr">${q.options.map((o,i)=>`<option value="${i}" ${i===q.correctIndex?'selected':''}>${String.fromCharCode(65+i)}</option>`).join('')}</select></div><div class="field"><label>Explanation (optional)</label><textarea id="exp">${esc(q.explanation)}</textarea></div><button class="btn primary" onclick="saveQ()">Save question</button> <button class="btn secondary" onclick="page('questions')">Cancel</button></div>`}
function saveQ(){let id=qid.value||uid(), q={id,section:qsec.value.trim()||'General',category:qcat.value.trim()||'General',question:qq.value.trim(),options:[op0.value,op1.value,op2.value,op3.value].map(x=>x.trim()),correctIndex:+corr.value,explanation:exp.value.trim()};if(!q.question||q.options.some(x=>!x))return toast('Complete the question and all 4 options.');let ix=db.questions.findIndex(x=>x.id===id);if(ix>=0)db.questions[ix]=q;else db.questions.push(q);save();toast('Question saved');page('questions')}
function editQ(id){let q=db.questions.find(x=>x.id===id);if(q)addPage(document.getElementById('content'),q)}
function deleteQ(id){if(confirm('Delete this question?')){db.questions=db.questions.filter(q=>q.id!==id);delete db.progress[id];db.mistakes=db.mistakes.filter(x=>x!==id);save();questionBank(document.getElementById('content'))}}
function progressPage(c){let groups={};db.questions.forEach(q=>{let s=q.section||q.category||'General',cat=q.category||'General';groups[s]??={};groups[s][cat]??=[];groups[s][cat].push(q)});let out='';for(let s of Object.keys(groups).sort()){out+=`<div class="card section"><h2>${esc(s)}</h2>`;for(let cat of Object.keys(groups[s]).sort()){let arr=groups[s][cat], practiced=arr.filter(q=>(db.progress[q.id]?.attempts||0)>0),att=arr.reduce((a,q)=>a+(db.progress[q.id]?.attempts||0),0),cor=arr.reduce((a,q)=>a+(db.progress[q.id]?.correct||0),0),comp=Math.round(practiced.length/arr.length*100),acc=att?Math.round(cor/att*100):0;out+=`<div style="padding:12px 0"><b>${esc(cat)}</b><span class="muted"> — ${practiced.length}/${arr.length} practiced · ${acc}% accuracy</span><div class="progressbar" style="margin-top:7px"><i style="width:${comp}%"></i></div></div>`}out+='</div>'}c.innerHTML=head('Progress','Calculated from the current question bank')+out+`<button class="btn danger" onclick="if(confirm('Reset all progress?')){db.progress={};db.mistakes=[];save();progressPage(document.getElementById('content'))}">Reset progress</button>`}
function mistakesPage(c){let qs=db.mistakes.map(id=>db.questions.find(q=>q.id===id)).filter(Boolean);c.innerHTML=head('Mistakes',`${qs.length} questions in your mistake bank`)+(qs.length?qs.map(q=>`<div class="card section"><b>${esc(q.question)}</b><div class="muted">${esc(q.section)} · ${esc(q.category)}</div><div class="review"><b>Correct:</b> ${esc(q.options[q.correctIndex])}<br>${esc(q.explanation||'')}</div><button class="btn success" onclick="db.mistakes=db.mistakes.filter(x=>x!=='${q.id}');save();mistakesPage(document.getElementById('content'))">Remove from mistakes</button></div>`).join(''):'<div class="card">No mistakes yet.</div>')}
function dataPage(c){c.innerHTML=head('Import / Export','The easiest way to add many built-in questions')+`<div class="grid"><div class="card"><h2>Import JSON</h2><p class="muted">Accepts an array of questions or <code>{"questions":[...]}</code>. Existing IDs are updated; new IDs are added.</p><input type="file" id="jsonfile" accept=".json,application/json"><br><br><button class="btn primary" onclick="importJSON()">Import file</button></div><div class="card"><h2>Export</h2><p class="muted">Download your complete question bank as JSON and keep a backup.</p><button class="btn secondary" onclick="exportJSON()">Download questions.json</button></div></div><div class="card" style="margin-top:16px"><h2>JSON format</h2><pre style="white-space:pre-wrap">${esc(JSON.stringify([{id:'unique-id',section:'Medicine',category:'Cardiology',question:'Question text',options:['A','B','C','D'],correctIndex:1,explanation:'Why B is correct.'}],null,2))}</pre></div>`}
async function importJSON(){let f=jsonfile.files[0];if(!f)return toast('Choose a JSON file.');try{let data=JSON.parse(await f.text()),arr=Array.isArray(data)?data:data.questions;if(!Array.isArray(arr))throw Error();let added=0,updated=0;arr.forEach((x,i)=>{let q={id:x.id||uid(),section:x.section||x.category||'General',category:x.category||x.section||'General',question:String(x.question||'').trim(),options:Array.isArray(x.options)?x.options.map(String):[],correctIndex:Number(x.correctIndex),explanation:String(x.explanation||'')};if(!q.question||q.options.length<2||!Number.isInteger(q.correctIndex)||q.correctIndex<0||q.correctIndex>=q.options.length)return;let ix=db.questions.findIndex(y=>y.id===q.id);if(ix>=0){db.questions[ix]=q;updated++}else{db.questions.push(q);added++}});save();toast(`Imported: ${added} added, ${updated} updated`);page('questions')}catch(e){toast('Invalid JSON file.')}}
function exportJSON(){let blob=new Blob([JSON.stringify(db.questions,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='questions.json';a.click();URL.revokeObjectURL(a.href)}
function settingsPage(c){c.innerHTML=head('Settings','Local administrator settings')+`<div class="card" style="max-width:650px"><div class="field"><label>Login ID</label><input id="sid" value="${esc(db.settings.loginId)}"></div><div class="field"><label>New password</label><input id="spw" type="password" placeholder="Leave blank to keep current"></div><button class="btn primary" onclick="saveSettings()">Save settings</button><hr style="border:0;border-top:1px solid var(--line);margin:25px 0"><h3>Data maintenance</h3><button class="btn danger" onclick="if(confirm('Delete ALL questions, progress and mistakes?')){db={questions:[],progress:{},mistakes:[],settings:db.settings};save();location.reload()}">Clear question bank</button></div>`}
function saveSettings(){db.settings.loginId=sid.value.trim()||'admin';if(spw.value)db.settings.password=spw.value;save();toast('Settings saved')}
if(sessionStorage.getItem(AUTH)==='1'){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');page('dashboard')}
</script>
</body>
</html>
